<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JASONBOOK - Événements</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{background:#f0f2f5}
header{background:#fff;display:flex;align-items:center;gap:12px;padding:10px 14px;position:sticky;top:0;z-index:20;box-shadow:0 1px 6px rgba(0,0,0,.1)}
.logo{display:flex;align-items:center;gap:7px;font-weight:900;color:#1877F2;font-size:21px;cursor:pointer}
.logo span{width:34px;height:34px;background:#1877F2;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px}
.logo i{color:#FFD700;font-style:normal}
header .search{flex:1;background:#f0f2f5;border:none;padding:11px 15px;border-radius:20px;font-size:14px;outline:none;cursor:pointer}
.icons{display:flex;gap:6px;align-items:center}
.icons a{width:40px;height:40px;background:#f0f2f5;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:19px}
.avatar{width:40px;height:40px;border-radius:50%;background:#1877F2;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;overflow:hidden;flex-shrink:0;cursor:pointer}
.avatar img{width:100%;height:100%;object-fit:cover}
.wrap{max-width:1000px;margin:16px auto;padding:0 12px}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.top h1{font-size:24px}
.btn-blue{background:#1877F2;color:#fff;border:none;padding:11px 18px;border-radius:10px;font-weight:800;cursor:pointer}
.btn-grey{background:#e4e6eb;border:none;padding:9px 14px;border-radius:8px;font-weight:700;cursor:pointer}
.btn-green{background:#42b72a;color:#fff;border:none;padding:9px 14px;border-radius:8px;font-weight:700;cursor:pointer}
.tabs{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto}
.tabs button{border:none;background:#fff;padding:10px 16px;border-radius:20px;font-weight:700;cursor:pointer;white-space:nowrap}
.tabs button.active{background:#1877F2;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.e-card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.1);cursor:pointer}
.e-card .cover{height:130px;background:linear-gradient(135deg,#1877F2,#0F2027);display:flex;align-items:center;justify-content:center;font-size:50px;overflow:hidden;position:relative}
.e-card .cover img{width:100%;height:100%;object-fit:cover}
.e-card .date-badge{position:absolute;top:10px;left:10px;background:#fff;border-radius:10px;padding:8px 12px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.e-card .date-badge b{font-size:18px;display:block;line-height:1;color:#e0245e}
.e-card .date-badge small{font-size:11px;color:#65676b;font-weight:700}
.e-card .body{padding:12px}
.e-card h3{font-size:16px;margin-bottom:4px}.e-card p{font-size:13px;color:#65676b;line-height:1.4;min-height:36px}
.e-card small{color:#999;font-size:12px}
.e-card .btns{display:flex;gap:7px;margin-top:10px}
.e-card .btns button{flex:1}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.empty{text-align:center;color:#65676b;padding:40px 10px;background:#fff;border-radius:12px}
.empty .big{font-size:50px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal.open{display:flex}
.modal-box{background:#fff;width:100%;max-width:480px;border-radius:14px;padding:20px;max-height:90vh;overflow-y:auto}
.modal-box input,.modal-box textarea,.modal-box select{width:100%;padding:12px;border:1.5px solid #ddd;border-radius:10px;margin-top:8px;font-size:14px;outline:none}
.modal-box textarea{min-height:60px;resize:vertical}
.modal-box img{width:100%;border-radius:10px;margin-top:10px;max-height:240px;object-fit:cover}
.bottom-nav{display:none}
@media(max-width:800px){.bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;justify-content:space-around;padding:12px;box-shadow:0 -1px 6px rgba(0,0,0,.1);z-index:30}.bottom-nav a{text-decoration:none;font-size:22px}.wrap{padding-bottom:70px}}
</style>
</head>
<body>

<header>
<div class="logo" onclick="location.href='feed.html'"><span>J</span>JASON<i>BOOK</i></div>
<input class="search" placeholder="Rechercher" onclick="location.href='recherche.html'" readonly>
<div class="icons"><a href="notifications.html">🔔</a><a href="messages.html">💬</a><div class="avatar" id="myAvatar" onclick="location.href='profil.html'">?</div></div>
</header>

<div class="wrap">
<div class="top"><h1>🎉 Événements</h1><button class="btn-blue" onclick="ouvrirCreer()">➕ Créer un événement</button></div>
<div class="tabs">
<button id="t-tous" class="active" onclick="showTab('tous')">Tous</button>
<button id="t-mes" onclick="showTab('mes')">Je participe</button>
<button id="t-miens" onclick="showTab('miens')">Mes événements</button>
</div>
<div id="sec-tous"><div class="grid" id="gridTous"></div><div class="empty" id="emptyTous" style="display:none"><div class="big">🎉</div><p>Aucun événement. Crée le premier !</p></div></div>
<div id="sec-mes" style="display:none"><div class="grid" id="gridMes"></div><div class="empty" id="emptyMes" style="display:none"><div class="big">🎉</div><p>Tu ne participes à aucun événement.</p></div></div>
<div id="sec-miens" style="display:none"><div class="grid" id="gridMiens"></div><div class="empty" id="emptyMiens" style="display:none"><div class="big">🎉</div><p>Tu n'as créé aucun événement.</p></div></div>

<!-- Détail -->
<div id="detail" style="display:none">
<div class="card">
<button class="btn-grey" onclick="fermerDetail()">← Retour</button>
<div style="margin-top:12px"><h2 id="dTitre"></h2><p id="dMeta" style="color:#65676b;font-size:14px;margin:6px 0"></p><p id="dDesc" style="white-space:pre-wrap"></p><img id="dImg" style="width:100%;border-radius:12px;margin-top:10px;display:none"></div>
<div style="display:flex;gap:8px;margin-top:14px"><button class="btn-blue" id="btnParticiper" style="flex:1;padding:12px" onclick="toggleParticiperDetail()">Participer</button><button class="btn-grey" id="btnSuppDetail" style="display:none" onclick="supprimerEventDetail()">🗑️ Supprimer</button></div>
</div>
<div class="card"><h3>Participants (<span id="nbPart">0</span>)</h3><div id="listePart" style="display:flex;flex-wrap:wrap;gap:8px"></div></div>
</div>
</div>

<nav class="bottom-nav"><a href="feed.html">🏠</a><a href="amis.html">👥</a><a href="creer-post.html">➕</a><a href="evenements.html">🎉</a><a href="profil.html">👤</a></nav>

<div class="modal" id="modalCreer"><div class="modal-box">
<h2>Créer un événement</h2>
<input id="eTitre" placeholder="Nom de l'événement * (ex: Anniversaire de Jason)">
<textarea id="eDesc" placeholder="Description..."></textarea>
<input type="date" id="eDate">
<input type="time" id="eHeure">
<input id="eLieu" placeholder="Lieu (ex: Kinshasa, Gombe)">
<select id="eType"><option>Fête</option><option>Concert</option><option>Mariage</option><option>Anniversaire</option><option>Sport</option><option>Église</option><option>Conférence</option><option>Autre</option></select>
<button class="btn-grey" style="width:100%;margin-top:10px" onclick="document.getElementById('ePhoto').click()">📷 Ajouter une affiche</button>
<input type="file" id="ePhoto" accept="image/*" style="display:none">
<img id="ePreview" style="display:none">
<button class="btn-blue" style="width:100%;margin-top:14px;padding:13px" onclick="creerEvent()">Créer l'événement</button>
<button class="btn-grey" style="width:100%;margin-top:8px;padding:12px" onclick="fermerCreer()">Annuler</button>
</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, push, set, remove, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const firebaseConfig = { apiKey: "AIzaSyA24pBo8mBWiZssPtep--MMBdB7c8_Lu4U", authDomain: "starlink-investit.firebaseapp.com", databaseURL: "https://starlink-investit-default-rtdb.firebaseio.com", projectId: "starlink-investit", storageBucket: "starlink-investit.firebasestorage.app", messagingSenderId: "807081599583", appId: "1:807081599583:web:e00ec3959bc4acdae031ea" };
const app = initializeApp(firebaseConfig); const db = getDatabase(app);
const uid = localStorage.getItem('jasonbook_uid'); if(!uid) location.href='index.html';
const monNom = localStorage.getItem('jasonbook_nom')||"";
const maPhoto = localStorage.getItem('jasonbook_photo')||"";
const maVille = localStorage.getItem('jasonbook_ville')||"";
document.getElementById('myAvatar').innerHTML = maPhoto ? `<img src="${maPhoto}">` : monNom.charAt(0).toUpperCase();
let tous=[], mesParticipations=new Set(), ouvertId=null, photoEvent="";
document.getElementById('eLieu').value=maVille;

window.showTab=(t)=>{ ['tous','mes','miens'].forEach(x=>{ document.getElementById('sec-'+x).style.display = x===t ? 'block' : 'none'; document.getElementById('t-'+x).classList.toggle('active',x===t); }); fermerDetail(); };
window.ouvrirCreer=()=>document.getElementById('modalCreer').classList.add('open');
window.fermerCreer=()=>document.getElementById('modalCreer').classList.remove('open');
window.fermerDetail=()=>{ document.getElementById('detail').style.display="none"; ouvertId=null; };
document.getElementById('ePhoto').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return; const r=new FileReader();
  r.onload=ev=>{ photoEvent=ev.target.result; document.getElementById('ePreview').src=photoEvent; document.getElementById('ePreview').style.display="block"; };
  r.readAsDataURL(f);
});
function emojiType(t){ if(t==='Concert') return '🎵'; if(t==='Mariage') return '💍'; if(t==='Anniversaire') return '🎂'; if(t==='Sport') return '⚽'; if(t==='Église') return '⛪'; if(t==='Conférence') return '🎤'; if(t==='Fête') return '🎉'; return '📅'; }
function dateBadge(dateStr){
  if(!dateStr) return '';
  const d=new Date(dateStr); if(isNaN(d)) return '';
  const mois=["JAN","FÉV","MAR","AVR","MAI","JUIN","JUIL","AOÛ","SEP","OCT","NOV","DÉC"][d.getMonth()];
  return `<div class="date-badge"><b>${d.getDate()}</b><small>${mois}</small></div>`;
}
function carte(e){
  const participe=mesParticipations.has(e.id);
  return `<div class="e-card" onclick="ouvrirDetail('${e.id}')"><div class="cover">${e.photo?`<img src="${e.photo}">`:emojiType(e.type)}${dateBadge(e.dateEvent)}</div><div class="body"><h3>${e.titre||""}</h3><p>${e.description||""}</p><small>📍 ${e.lieu||""} • 🕐 ${e.dateEvent||""} ${e.heure||""} • 👥 ${e.participantsCount||0} participant(s)</small><div class="btns"><button class="${participe?'btn-green':'btn-blue'}" onclick="event.stopPropagation();toggleParticiper('${e.id}')">${participe?'✅ Je participe':'Participer'}</button><button class="btn-grey" onclick="event.stopPropagation();ouvrirDetail('${e.id}')">Voir</button></div></div></div>`;
}
function rendre(){
  const gT=document.getElementById('gridTous'); gT.innerHTML=""; document.getElementById('emptyTous').style.display=tous.length?'none':'block'; tous.forEach(e=>gT.innerHTML+=carte(e));
  const mes=tous.filter(e=>mesParticipations.has(e.id)); const gM=document.getElementById('gridMes'); gM.innerHTML=""; document.getElementById('emptyMes').style.display=mes.length?'none':'block'; mes.forEach(e=>gM.innerHTML+=carte(e));
  const miens=tous.filter(e=>e.createurUid===uid); const gMi=document.getElementById('gridMiens'); gMi.innerHTML=""; document.getElementById('emptyMiens').style.display=miens.length?'none':'block'; miens.forEach(e=>gMi.innerHTML+=carte(e));
}
window.creerEvent=async()=>{
  const titre=document.getElementById('eTitre').value.trim();
  if(!titre){ alert("Donne un nom à l'événement"); return; }
  const newRef=push(ref(db,'jasonbook/evenements'));
  await set(newRef,{ id:newRef.key, titre:titre, description:document.getElementById('eDesc').value, dateEvent:document.getElementById('eDate').value, heure:document.getElementById('eHeure').value, lieu:document.getElementById('eLieu').value, type:document.getElementById('eType').value, photo:photoEvent||"", createurUid:uid, createurNom:monNom, participantsCount:1, date:new Date().toLocaleString(), timestamp:Date.now() });
  await set(ref(db,'jasonbook/participantsEvent/'+newRef.key+'/'+uid), { nom:monNom, photo:maPhoto||"" });
  await set(ref(db,'jasonbook/eventsUser/'+uid+'/'+newRef.key), true);
  fermerCreer(); photoEvent=""; alert("Événement créé ! 🎉");
};
window.toggleParticiper=async (eid)=>{
  if(mesParticipations.has(eid)){
    await remove(ref(db,'jasonbook/participantsEvent/'+eid+'/'+uid));
    await remove(ref(db,'jasonbook/eventsUser/'+uid+'/'+eid));
    const s=await get(ref(db,'jasonbook/evenements/'+eid)); const g=s.val()||{};
    await set(ref(db,'jasonbook/evenements/'+eid+'/participantsCount'), Math.max(0,(g.participantsCount||1)-1));
  } else {
    await set(ref(db,'jasonbook/participantsEvent/'+eid+'/'+uid), { nom:monNom, photo:maPhoto||"" });
    await set(ref(db,'jasonbook/eventsUser/'+uid+'/'+eid), true);
    const s=await get(ref(db,'jasonbook/evenements/'+eid)); const g=s.val()||{};
    await set(ref(db,'jasonbook/evenements/'+eid+'/participantsCount'), (g.participantsCount||0)+1);
  }
};
window.ouvrirDetail=async (eid)=>{
  ouvertId=eid; ['tous','mes','miens'].forEach(x=>document.getElementById('sec-'+x).style.display='none');
  const e=tous.find(x=>x.id===eid); if(!e) return;
  document.getElementById('detail').style.display="block";
  document.getElementById('dTitre').innerText=e.titre||"";
  document.getElementById('dMeta').innerText=`${e.type||""} • 📍 ${e.lieu||""} • 🕐 ${e.dateEvent||""} ${e.heure||""} • Créé par ${e.createurNom||""}`;
  document.getElementById('dDesc').innerText=e.description||"";
  const img=document.getElementById('dImg'); if(e.photo){ img.src=e.photo; img.style.display="block"; } else img.style.display="none";
  const btn=document.getElementById('btnParticiper'); const participe=mesParticipations.has(eid); btn.innerText=participe?"✅ Je participe - Cliquez pour annuler":"Participer"; btn.className=participe?"btn-green":"btn-blue"; btn.style.flex="1"; btn.style.padding="12px"; btn.style.border="none"; btn.style.borderRadius="10px"; btn.style.fontWeight="800"; btn.style.cursor="pointer";
  document.getElementById('btnSuppDetail').style.display = e.createurUid===uid ? "block" : "none";
  onValue(ref(db,'jasonbook/participantsEvent/'+eid), (snap)=>{
    const d=snap.val(); const list=d?Object.values(d):[]; document.getElementById('nbPart').innerText=list.length;
    document.getElementById('listePart').innerHTML=list.map(p=>`<span style="background:#f0f2f5;padding:8px 12px;border-radius:20px;font-size:13px;font-weight:700">${p.photo?`<img src="${p.photo}" style="width:22px;height:22px;border-radius:50%;vertical-align:middle">`:"👤"} ${p.nom||""}</span>`).join('') || '<p style="color:#999">Aucun participant</p>';
  });
};
window.toggleParticiperDetail=async()=>{ if(!ouvertId) return; await toggleParticiper(ouvertId); setTimeout(()=>ouvrirDetail(ouvertId),400); };
window.supprimerEventDetail=async()=>{ if(!ouvertId) return; if(!confirm("Supprimer cet événement ?")) return; await remove(ref(db,'jasonbook/evenements/'+ouvertId)); await remove(ref(db,'jasonbook/participantsEvent/'+ouvertId)); fermerDetail(); };

onValue(ref(db,'jasonbook/evenements'), s=>{ const d=s.val(); tous=d?Object.entries(d).map(([id,e])=>({id,...e})).sort((a,b)=>(b.timestamp||0)-(a.timestamp||0)):[]; rendre(); });
onValue(ref(db,'jasonbook/eventsUser/'+uid), s=>{ const d=s.val(); mesParticipations=new Set(d?Object.keys(d):[]); rendre(); });
</script>
</body>
</html>
